<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7798585050512728"
     crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Endless Wordhunt</title> <link rel="icon" type="image/png" href="assets/favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="flex items-center justify-center min-h-screen">

    <button
        id="sound-toggle"
        type="button"
        class="fixed top-4 right-4 z-50 bg-white/90 text-slate-800 font-semibold p-3 rounded-full shadow-lg hover:bg-white transition focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-400 flex items-center justify-center"
        aria-pressed="false"
        aria-label="Mute sound"
    >
        <img
            id="sound-toggle-icon"
            src="assets/Speaker_Icon.svg"
            alt=""
            class="w-6 h-6"
            aria-hidden="true"
        />
        <span id="sound-toggle-label" class="sr-only">Mute sound</span>
    </button>

    <div id="game-container" class="w-full max-w-md mx-auto p-4">
        
        <p id="game-subtitle" class="text-black text-sm text-center mb-2 italic"></p>

        <div class="bg-[#84a98c] rounded-lg shadow-xl p-6">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <span class="text-white">Score</span>
                    <p id="score" class="text-2xl font-bold text-white">0</p>
                </div>
                <div id="timer-container">
                    <span id="timer-label" class="text-white">Time</span>
                    <p id="timer" class="text-2xl font-bold text-white"></p>
                </div>
            </div>
            <div id="current-word-container" class="w-full h-12 bg-slate-200 rounded-lg flex items-center justify-center mb-4">
                <p id="current-word" class="text-2xl font-semibold text-black tracking-widest"></p>
            </div>
            <div id="grid-container" class="relative grid grid-cols-4 gap-2 aspect-square select-none">
                <svg id="trace-svg" class="absolute top-0 left-0 w-full h-full pointer-events-none z-10"></svg>
            </div>
            <div id="endless-buttons" class="grid grid-cols-1 sm:grid-cols-3 gap-2 mt-4 hidden">
                <button id="reveal-btn" class="w-full bg-yellow-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-yellow-600 transition duration-300 shadow-md">Reveal</button>
                <button id="new-board-btn" class="w-full bg-indigo-500 text-white font-bold py-3 px-4 rounded-lg hover:bg-indigo-600 transition duration-300 shadow-md">New Board</button>
                <a href="index.html" class="w-full text-center bg-gray-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-700 transition duration-300 shadow-md sm:col-start-3">Change Mode</a>
            </div>

            <div id="timed-button" class="grid grid-cols-1 gap-2 mt-4 hidden">
                <a href="index.html" class="w-full text-center bg-gray-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-gray-700 transition duration-300 shadow-md">Change Mode</a>
            </div>
        </div>
        <div id="words-list-container" class="bg-[#84a98c] rounded-lg shadow-xl p-6 mt-4 hidden">
            <h2 class="text-xl font-bold text-white mb-2">Possible Words (<span id="word-count">0</span>)</h2>
            <div id="possible-words" class="h-64 overflow-y-auto pr-2 custom-scrollbar grid grid-cols-2 sm:grid-cols-3 gap-x-4 gap-y-1"></div>
        </div>
    </div>

    <div id="message-overlay" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div id="message-box" class="bg-[#84a98c] p-8 rounded-lg shadow-2xl text-center max-w-sm mx-4">
            <p id="message-text" class="text-white text-2xl font-bold text-slate-800"></p>
            <p id="message-score" class="text-white text-xl mt-2"></p>
            
            <div id="timed-words-wrapper" class="mt-2 hidden bg-white rounded-lg p-4 text-left shadow-inner">
                <ul id="timed-words-list"
                    class="max-h-48 overflow-y-auto custom-scrollbar grid grid-cols-2 gap-x-4 gap-y-1 mt-2 text-left text-slate-800">
                </ul>
            </div>


            <a href="#" id="message-close-btn" class="inline-block mt-6 bg-sky-600 text-white font-bold py-2 px-6 rounded-lg hover:bg-sky-700 transition duration-300">
                Play Again
            </a>
        </div>
    </div>

    <script src="scripts/script.js"></script>
    <script>
        // Initialize the game as soon as the main script is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initializeGame();
        });
    </script>
</body>
</html>
